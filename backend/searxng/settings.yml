# Minimal SearXNG config for Spinestack. Only the API talks to it.
use_default_settings: true

server:
  # Change this to any long random string before putting it online.
  secret_key: "change-me-to-a-long-random-string"
  limiter: false
  image_proxy: false

search:
  safe_search: 1
  formats:
    - html
    - json
