/* the feed: a timeline, one column of 600px in the middle of the page's. The composer, the tabs (staying under the
   bar as you scroll), then the posts (post.js) and shelves saved, each with a thin rule under it and no box */
.tl{max-width:600px;margin-inline:auto}
.tl .tabs{position:sticky;top:var(--barh,64px);z-index:4;background:var(--paper);padding-top:var(--s4)}
.tl .items{gap:0;margin-top:0}
.tl .items > li{border-bottom:1px solid var(--hair)}
.tl .items > li.item{padding:var(--s4) 0}
/* a shelf saved: the spines it added, 112px tall (their titles can be read), standing on a line only as wide as they
   are and 16px more, so one spine doesn't stand at the end of a long empty shelf */
.shelfpost .strip{display:flex;align-items:flex-end;gap:2px;height:112px;width:max-content;min-width:var(--s6);max-width:100%;padding-right:var(--s4);border-bottom:1px solid var(--ink);margin-top:var(--s2);overflow:hidden}
.shelfpost .strip canvas{display:block;flex:none}
.fnone{display:grid;justify-items:start;gap:var(--s4);margin:var(--s5) 0 0}
.fnone > p{margin:0}
.linkish{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:none;text-decoration-thickness:1px;text-underline-offset:3px}
.linkish:hover,.linkish:focus-visible{text-decoration:underline;text-underline-offset:3px}
#state{margin:var(--s5) 0 0}
#more{margin-top:var(--s6)}
/* a log's ••• (a touch screen: Add to watchlist) at the top right of the log, so the caption keeps its width */
.items .item.log{position:relative}
.items .item.log>.wmorewrap{position:absolute;top:-12px;right:0}
@media (pointer:coarse){.items .item.log .line{padding-right:44px}}
/* "3 new posts": checked every minute, shown at the top of the list; it never moves the page by itself */
.newpill{position:sticky;top:calc(var(--barh,64px) + 48px);z-index:4;display:block;margin:var(--s4) auto 0;background:var(--ink);color:var(--paper);border:0;border-radius:999px;
  padding:var(--s2) var(--s4);font:600 var(--fs-btn)/1.35 var(--mono);cursor:pointer}
.newpill:hover{background:#222}
/* an empty Friends tab: People to follow, rows like posts with Follow at the right, then the Everyone timeline */
.tofollow,.tfall{margin-top:var(--s5);width:100%}
.tfl{list-style:none;margin:0;padding:0}
.tfl > li{border-bottom:1px solid var(--hair)}
.post.tf{align-items:center;grid-template-columns:40px minmax(0,1fr) auto}
.post.tf .tlast{margin:var(--s1) 0 0;color:var(--grey);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (pointer:coarse){ .post.tf .tlast{margin-top:var(--s4)} }   /* clear of the name's press area */
.tfall h2 .more{margin-left:auto}
</style>

<script>
(() => {
/* The feed: /feed/ (?friends, or ?following as it was, or ?everyone picks the tab: Friends · Everyone). A line for each shelf saved and each film or book
   logged (a post: post.js), newest first, 20 at a time, the next 20 coming as the end nears. The database decides what
   shows (activity(), supabase/migrations/0007_logs_watchlist.sql): EVERYONE is public profiles, FOLLOWING the people
   you follow; with nothing there, People to follow. Every minute it looks for newer ones and says how many ("3 new
   posts"); pressing that shows them. On a database without 0007 the feed is shelves only, as feed() in 0006 has them.
   Only saving a shelf in the builder moves it up; renaming it doesn't. */
const $ = s => document.querySelector(s);
const WORKER = String(window.SPINESTACK_WORKER || '').trim().replace(/\/+$/, '');
const SB_URL = String(window.SPINESTACK_SUPABASE_URL || '').trim().replace(/\/+$/, ''), SB_KEY = String(window.SPINESTACK_SUPABASE_KEY || '').trim();
const SB_LIB = {src:'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js', integrity:'sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok'};
const PAGE = 20;
const params = new URLSearchParams(location.search);
// ?you, from when there was a You tab (your own are on your profile's Activity now), is Following
const asked = params.has('you') || params.has('friends') ? 'following' : ['following', 'everyone'].find(k => params.has(k)) || '';

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const profileUrl = (name, shelf) => '../u/?' + name + (shelf ? '&shelf=' + shelf : '');
let toastT = 0; function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 4200); }
function friendly(e){
  const m = (e && e.message) || '';
  if (/fetch|network/i.test(m)) return 'Couldn’t reach shelfstackd. Check your connection and try again.';
  return m || 'Something went wrong. Try again in a moment.';
}
// 2h, 3d: how long ago a shelf was saved. The browser says it (Intl.RelativeTimeFormat: "2h ago") and its "ago" is
// left off. The same as in u/: keep the two in step.
const RTF = new Intl.RelativeTimeFormat('en', {style: 'narrow', numeric: 'always'});
function ago(t){
  const s = Math.max(0, (Date.now() - new Date(t)) / 1000), D = 86400;
  if (s < 60) return 'now';
  const [n, unit] = s < 3600 ? [s / 60, 'minute'] : s < D ? [s / 3600, 'hour'] : s < 7*D ? [s / D, 'day'] : s < 30*D ? [s / (7*D), 'week'] : s < 365*D ? [s / (30*D), 'month'] : [s / (365*D), 'year'];
  return RTF.format(-Math.floor(n), unit).replace(/\s*ago$/, '').replace(/\s+/g, '');
}
// a log is by the day: today, yesterday, then as ago() says it (3d, 2w). The same as in u/
function day(t){
  const d = new Date(t), now = new Date(), start = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const n = Math.round((start(now) - start(d)) / 864e5);
  return n <= 0 ? 'today' : n === 1 ? 'yesterday' : ago(t);
}

/* ---------- signing in (the same Supabase client and settings as u/) ---------- */
const me = {sb:null, user:null, profile:null};
let sbLoading = null;
function supa(){
  return sbLoading || (sbLoading = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = SB_LIB.src; s.integrity = SB_LIB.integrity; s.crossOrigin = 'anonymous';
    s.onload = () => { me.sb = window.supabase.createClient(SB_URL, SB_KEY, {auth:{flowType:'pkce', persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}}); res(me.sb); };
    s.onerror = () => { sbLoading = null; s.remove(); rej(new Error('Sign-in couldn’t load. Check your connection and try again.')); };
    document.head.appendChild(s);
  }));
}
const hasSession = () => { try { return Object.keys(localStorage).some(k => /^sb-.+-auth-token$/.test(k)); } catch { return false; } };
const returning = () => /[?&](code|error|error_description)=/.test(location.search);
const here = () => location.pathname + (asked ? '?' + asked : '');
async function token(){
  if (!me.sb) return null;
  const {data:{session}} = await me.sb.auth.getSession();
  return session ? session.access_token : null;
}
// Supabase's REST API: as the signed-in person when there is one, otherwise as a visitor
async function api(path, opt = {}){
  const t = await token(), r = await fetch(`${SB_URL}/rest/v1/${path}`, {...opt,
    headers: {apikey: SB_KEY, 'Content-Type': 'application/json', ...(t ? {Authorization: 'Bearer ' + t} : {}), ...(opt.headers || {})}});
  const j = r.status === 204 ? null : await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && j.message) || 'Couldn’t load the feed. Try again in a moment.');
  return j;
}
const rpc = (fn, args) => api('rpc/' + fn, {method:'POST', body: JSON.stringify(args)});
async function startSession(){
  const back = returning();   // asked before Supabase takes ?code= off
  if (!hasSession() && !back) return;
  try {
    const err = new URLSearchParams(location.search).get('error_description');
    const sb = await supa(), {data:{session}} = await sb.auth.getSession();   // finishes a Google sign-in coming back with ?code=
    if (back) history.replaceState(null, '', here() + location.hash);
    if (err) toast('Sign-in didn’t finish: ' + err);
    me.user = session && session.user;
    if (me.user){
      const rows = await api(`profiles?select=id,username,display_name,avatar_key&id=eq.${me.user.id}`);
      me.profile = rows[0] || null;
    }
    sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') location.reload(); });
  } catch (e){ if (me.user && !me.profile) me.unreachable = true; toast(friendly(e)); }   // unreachable: signed in, but the account couldn't be read (not "no username yet")
}
// the bar (nav.js) shows who is signed in
const paintAcct = () => Nav.paint(me);
const signIn = () => openSheet('#signSheet', '#googleBtn');
Nav.onSignIn(signIn);
// Sign out, from the account menu (nav.js): the page starts again signed out
Nav.onSignOut(async () => { try { const {error} = await (await supa()).auth.signOut({scope: 'local'}); if (error) throw error; } catch (e){ toast(friendly(e)); } });
$('#googleBtn').addEventListener('click', async () => {
  const btn = $('#googleBtn'); btn.disabled = true;
  try {
    const sb = await supa(), back = location.origin + location.pathname + '?' + (feed.scope === 'everyone' ? 'everyone' : 'friends');
    const {error} = await sb.auth.signInWithOAuth({provider:'google', options:{redirectTo: back}});
    if (error) throw error;
  } catch (e){ btn.disabled = false; toast(friendly(e)); }
});

/* sheets */
let sheetFrom = null;
function openSheet(id, focus){ sheetFrom = document.activeElement; $(id).hidden = false; const f = $(focus); if (f) f.focus(); }
function closeSheets(){ document.querySelectorAll('.sheet').forEach(s => s.hidden = true); if (sheetFrom && sheetFrom.focus) sheetFrom.focus(); }
document.querySelectorAll('.sheet').forEach(s => s.addEventListener('click', e => { if (e.target === s || e.target.closest('[data-close]')) closeSheets(); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.querySelector('.sheet:not([hidden])')) closeSheets(); });

/* ---------- the feed ---------- */
const feed = {scope:'', last:null, first:null, run:0, logs:true, social:false, recs:null};   // logs: false once the database says activity() isn't there; recs: is 0010 there (timeline())
const avatar = x => `<a class="fa" href="${esc(profileUrl(x.username))}" tabindex="-1" aria-hidden="true">${x.avatar_key ? `<img src="${esc(`${WORKER}/m/img?k=${encodeURIComponent(x.avatar_key)}`)}" alt="" loading="lazy">` : esc(((x.display_name || '').trim() || x.username).trim()[0] || '·')}</a>`;
const when = (t, text) => `<span class="ago">· <time datetime="${esc(t)}" title="${esc(new Date(t).toLocaleString())}">${text}</time></span>`;
const COVER = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cover')) || 72;   // how wide a log's cover is (site.css)
// one line: "@abc shelved my films · 2h" (in YOU: "You shelved…", and a private shelf says so), its card under it;
// or "@abc watched Gummo · today", its cover, small, worn by how long ago that was, and the caption beside it
function item(x){
  const li = document.createElement('li'), who = esc(profileUrl(x.username)), by = `<a href="${who}">${x.mine ? 'You' : '@' + esc(x.username)}</a>`;
  li.className = 'item';
  // a log is a post (post.js): its line, cover and review, and its row of actions
  if (x.what === 'log' && window.Posts) return Posts.item(x, {social: feed.social, cover: COVER, onGone: () => { if (!$('#items').children.length) none(feed.scope); }});
  if (x.what === 'log'){
    const verb = x.kind === 'movie' ? 'watched' : 'read', label = `${x.title}${x.year ? ` (${x.year})` : ''}`;
    li.classList.add('log');
    li.innerHTML = `${avatar(x)}<p class="line">${by} ${verb} <b>${esc(x.title)}</b> ${when(x.at, day(x.at))}</p>
      <div class="logbody"><span class="cover"></span>${x.caption ? `<p class="say">${esc(x.caption)}</p>` : ''}</div>`;
    li.querySelector('.cover').append(Wear.cover({kind: x.kind, src: x.cover_src ? `${WORKER}/img?url=${encodeURIComponent(x.cover_src.replace(/^url:/, ''))}` : '', seed: x.id, at: x.at,
      label: `${label}, ${verb} by @${x.username}`, width: COVER}));
    // someone else's log: onto your watchlist from its cover (signed out, the sign-in sheet first)
    if (!(me.user && x.owner === me.user.id)) Nav.watchable(li.querySelector('.cover'), {kind: x.kind, title: x.title, year: x.year ? String(x.year) : '', creator: x.author || '', cover: x.cover_src ? x.cover_src.replace(/^url:/, '') : ''}, {moreIn: li});
    return li;
  }
  if (x.what === 'rec') return recPost(x);
  return shelfPost(x);
}
/* A shelf saved, as a compact post: "@div added 3 to films for the train" (the shelf by its name), and a strip of just the spines that save added
   (80px tall, drawn by bare.js), the whole post a press through to the shelf. The builder marks each spine with when it
   was first saved (look.at), so the spines added in the hour before the save are the new ones: saving again within
   the hour keeps them together in one post, since a shelf is one line on the feed whatever its saves. A save from
   before those marks, or one that only moved or changed spines, says "updated <its name>" (or "started <its name>")
   with its last five spines. */
const HOUR = 3600e3;
function addedBy(x){
  const items = x.items || [], at = new Date(x.at).getTime();
  return items.filter(r => r.look && +r.look.at && +r.look.at * 1000 >= at - HOUR && +r.look.at * 1000 <= at + 60e3);
}
function shelfPost(x){
  const li = document.createElement('li'), to = profileUrl(x.username, x.id), name = (x.display_name || '').trim(), added = addedBy(x);
  li.className = 'post shelfpost'; li.dataset.id = x.id;
  // the shelf by its name (a person can have more than one): "added 3 to films for the train"
  const shelf = `<a href="${esc(to)}">${esc(Shelf.shelfName({name: x.name, caption: x.caption}))}</a>`;
  const what = added.length === 1 ? `added ${esc(added[0].title || 'a spine')} to ${shelf}`
    : added.length ? `added ${added.length} to ${shelf}`
    : `${x.updated ? 'updated' : 'started'} ${shelf}`;
  li.innerHTML = `<a class="pava" href="${esc(profileUrl(x.username))}" tabindex="-1" aria-hidden="true">${window.Posts ? Posts.avaHtml(x) : ''}</a>
    <div class="pbody">
      <p class="phead"><a class="pwho" href="${esc(profileUrl(x.username))}">${name ? `<b>${esc(name)}</b> ` : ''}<span>@${esc(x.username)}</span></a><span class="ago">· <a href="${esc(to)}"><time datetime="${esc(x.at)}" title="${esc(new Date(x.at).toLocaleString())}">${ago(x.at)}</time></a></span></p>
      <p class="pwhat">${what}${x.is_public === false ? ' <span class="tag">private</span>' : ''}</p>
      <a class="strip" href="${esc(to)}" tabindex="-1" aria-label="${esc(added.length ? `The ${added.length === 1 ? 'spine' : added.length + ' spines'} @${x.username} added` : `@${x.username}'s shelf`)}"></a>
    </div>`;
  li.addEventListener('click', e => { if (!e.target.closest('a, button') && !String(getSelection()).trim()) location.href = to; });
  // the strip: the new spines, or the shelf's last five
  const rows = added.length ? added : (x.items || []).slice(-5);
  if (rows.length && window.Bare) Bare.ready.then(() => Bare.books(rows)).then(books => { if (books.length) li.querySelector('.strip').replaceChildren(...Bare.spines(books, 112)); });
  return li;
}
/* A rec shown in the feed (0010, only when its sender left Show in feed on): "@mira recommended Paris, Texas (1984) to
   @kit", compact, with the cover small and clean at the right (not worn: nobody has logged it). Never the note. */
function recPost(x){
  const li = document.createElement('li'), name = (x.display_name || '').trim(), label = `${x.title}${x.year ? ` (${x.year})` : ''}`;
  li.className = 'post recpost'; li.dataset.id = x.id;
  li.innerHTML = `<a class="pava" href="${esc(profileUrl(x.username))}" tabindex="-1" aria-hidden="true">${window.Posts ? Posts.avaHtml(x) : ''}</a>
    <div class="pbody">
      <p class="phead"><a class="pwho" href="${esc(profileUrl(x.username))}">${name ? `<b>${esc(name)}</b> ` : ''}<span>@${esc(x.username)}</span></a><span class="ago">· <time datetime="${esc(x.at)}" title="${esc(new Date(x.at).toLocaleString())}">${ago(x.at)}</time></span></p>
      <p class="pwhat">recommended <a href="${esc(Nav.titleUrl({kind: x.kind, title: x.title, year: x.year}))}">${esc(x.title)}</a>${x.year ? ` (${esc(x.year)})` : ''} to <a href="${esc(profileUrl(x.to_username))}">@${esc(x.to_username)}</a></p>
    </div>
    <span class="cover">${x.cover_src ? `<img class="clean" src="${esc(`${WORKER}/img?url=${encodeURIComponent(x.cover_src.replace(/^url:/, ''))}`)}" alt="The cover of ${esc(label)}" loading="lazy">` : ''}</span>`;
  if (!(me.user && x.owner === me.user.id)) Nav.watchable(li.querySelector('.cover'), {kind: x.kind, title: x.title, year: x.year ? String(x.year) : '', creator: x.author || '', cover: x.cover_src ? x.cover_src.replace(/^url:/, '') : ''}, {moreIn: li.querySelector('.pbody')});
  return li;
}
// a shelf as feed() (0006) gives it, in activity()'s shape
const fromFeed = r => ({what: 'shelf', id: r.shelf_id, at: r.saved_at, owner: r.owner, username: r.username, display_name: r.display_name, avatar_key: r.avatar_key,
  caption: r.caption, name: r.name, preview_key: r.preview_key, created_at: r.created_at, updated_at: r.updated_at, updated: r.updated, is_public: r.is_public});
// the next page of the tab: activity() while it's there, otherwise what 0006 has
const missing = e => /PGRST20[25]|42883|Could not find the function|does not exist/i.test(String(e && e.message));
const recsThere = async () => { if (feed.recs === null) feed.recs = !!(await Nav.loadRecs()); return feed.recs; };
async function page(){
  const last = feed.last;
  if (feed.logs){
    try { return await rpc((await recsThere()) ? 'timeline' : 'activity', {scope: feed.scope, before: last ? last.at : null, before_id: last ? last.id : null, n: PAGE}); }
    catch (e){ if (!missing(e)) throw e; feed.logs = false; }
  }
  return (await rpc('feed', {scope: feed.scope, before: last ? last.at : null, before_id: last ? last.id : null, n: PAGE})).map(fromFeed);
}
function none(kind){
  const box = $('#none');
  if (kind === 'signin') box.innerHTML = `<p><button class="linkish" type="button" data-signin>Sign in</button> to see who you follow.</p>`;
  else if (kind === 'following'){ box.innerHTML = '<p>Nobody you follow has posted.</p>'; toFollow(); }
  else box.innerHTML = '<p>Nothing on the feed yet.</p>';
  box.hidden = false;
}
$('#none').addEventListener('click', e => {
  if (e.target.closest('[data-signin]')) signIn();
  const b = e.target.closest('[data-scope]'); if (b) show(b.dataset.scope);
});
async function show(scope){
  const run = ++feed.run;
  feed.scope = scope; feed.last = null; feed.first = null; $('#newPill').hidden = true;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.scope === scope)));
  history.replaceState(null, '', location.pathname + '?' + (scope === 'following' ? 'friends' : scope) + location.hash);   // back from a shelf lands on the same tab
  $('#items').replaceChildren(); $('#none').hidden = true; $('#more').hidden = true;
  if (scope !== 'everyone' && !me.user){ $('#state').hidden = true; none('signin'); return; }
  $('#state').textContent = 'Loading…'; $('#state').hidden = false;
  await more(run);
}
// what a page of rows needs before it's drawn: with 0009 each log's rating, review, counts and what you've done to it
// (post_stats()); each shelf's spines, in one ask, for its strip. null when another tab was picked meanwhile
async function enrich(rows, run){
  // with 0009, each log's rating, review, counts and what you've done to it (post_stats())
  if (window.Posts){
    feed.social = await Posts.ready();
    const ids = rows.filter(x => x.what === 'log').map(x => x.id);
    let st = new Map(); try { st = await Posts.stats(ids); } catch {}
    if (run !== feed.run) return null;
    rows = rows.map(x => st.has(x.id) ? {...x, ...st.get(x.id)} : x);
  }
  // each shelf's spines, in one ask, for its strip
  const shelves = rows.filter(x => x.what === 'shelf').map(x => x.id);
  if (shelves.length){
    let items = [];
    try { items = await api(`shelf_items?select=shelf_id,position,item_id,kind,title,author,year,spine_src,cover_src,look&shelf_id=in.(${shelves.join(',')})&order=position`); } catch {}
    if (run !== feed.run) return null;
    rows = rows.map(x => x.what !== 'shelf' ? x : {...x, items: (items || []).filter(r => r.shelf_id === x.id)});
  }
  return rows;
}
async function more(run = feed.run){
  const btn = $('#more');
  btn.disabled = true;
  let rows;
  try { rows = await page(); }
  catch (e){
    if (run !== feed.run) return;
    btn.disabled = false;
    if ($('#items').children.length) toast(friendly(e)); else $('#state').textContent = friendly(e);
    return;
  }
  if (run !== feed.run) return;   // another tab was picked meanwhile
  rows = await enrich(rows, run); if (!rows) return;
  btn.disabled = false; $('#state').hidden = true;
  for (const x of rows) $('#items').append(item(x));
  const end = rows[rows.length - 1];
  if (end) feed.last = {at: end.at, id: end.id};
  if (!feed.first && rows[0]) feed.first = {at: rows[0].at, id: rows[0].id};
  btn.hidden = rows.length < PAGE;
  if (!$('#items').children.length) none(feed.scope);
}
// a log posted with + ADD on this page: the tab starts again, with it at the top
// a log posted on this page (the composer, + ADD, Same): it goes on top of Everyone at once, with nothing reloaded and
// nothing moved; Friends is the people you follow, so it isn't there
document.addEventListener('shelfstackd:added', e => {
  const d = e.detail || {};
  if (d.what !== 'log' || feed.scope !== 'everyone') return;
  if (!d.post || !d.post.id || !window.Posts){ show(feed.scope); return; }
  $('#none').hidden = true;
  $('#items').prepend(item(d.post));
  feed.first = {at: d.post.at, id: d.post.id};
});
$('#more').addEventListener('click', () => more());
// the next 20 come by themselves as the end of the list nears (Load more is still there to press)
if ('IntersectionObserver' in window) new IntersectionObserver(es => { if (es.some(e => e.isIntersecting) && !$('#more').hidden && !$('#more').disabled) more(); }, {rootMargin: '600px 0px'}).observe($('#more'));

/* ---------- "3 new posts" ---------- */
// every minute, while the page is in view: how many are newer than the top one shown. Pressing the pill shows them;
// nothing moves the page by itself
const isNewer = (x, top) => x.at > top.at || (x.at === top.at && x.id > top.id);
async function checkNew(){
  if (document.hidden || !feed.first || (feed.scope === 'following' && !me.user)) return;
  const run = feed.run, top = feed.first;
  let rows; try { rows = await page0(feed.scope); } catch { return; }
  if (run !== feed.run) return;
  const n = rows.filter(x => isNewer(x, top)).length, pill = $('#newPill');
  pill.textContent = n >= PAGE ? `${PAGE}+ new posts` : `${n} new post${n === 1 ? '' : 's'}`;
  pill.hidden = !n;
}
setInterval(checkNew, 60000);
$('#newPill').addEventListener('click', async () => {
  $('#newPill').hidden = true;
  await show(feed.scope);
  document.querySelector('.tabs').scrollIntoView({block: 'start'});
});
// the newest on a tab: activity() while it's there, otherwise feed() (0006)
const page0 = async scope => rpc((await recsThere()) ? 'timeline' : 'activity', {scope, before: null, before_id: null, n: PAGE}).catch(e => {
  if (!missing(e)) throw e;
  return rpc('feed', {scope, before: null, before_id: null, n: PAGE}).then(r => r.map(fromFeed));
});

/* ---------- an empty Friends tab: People to follow, then Everyone ---------- */
// People to follow: the people behind the newest public shelves and posts, not you and not anyone you follow, as rows
// like posts (photo, name and @name, what they did last, Follow at the right). Then the Everyone timeline under it,
// with a way to the tab itself
async function toFollow(){
  if (!me.user || !me.profile) return;
  const run = feed.run;
  let rows = [], follows = [];
  try { [rows, follows] = await Promise.all([page0('everyone'), api(`follows?select=followee&follower=eq.${me.user.id}`)]); } catch { return; }
  if (run !== feed.run) return;
  const skip = new Set([me.user.id, ...(follows || []).map(f => f.followee)]), seen = new Set(), people = [];
  for (const x of rows){ if (skip.has(x.owner) || seen.has(x.owner)) continue; seen.add(x.owner); people.push(x); }
  if (people.length){
    const box = document.createElement('section'); box.className = 'tofollow'; box.setAttribute('aria-labelledby', 'tofollowH');
    box.innerHTML = '<h2 id="tofollowH">People to follow</h2><ul class="tfl"></ul>';
    box.querySelector('ul').append(...people.slice(0, 6).map(x => {
      const li = document.createElement('li'), name = (x.display_name || '').trim(), href = profileUrl(x.username);
      const last = x.what === 'log' ? `${x.kind === 'movie' ? 'watched' : 'read'} ${x.title}` : x.what === 'rec' ? `recommended ${x.title}` : `${x.updated ? 'updated' : 'started'} ${Shelf.shelfName({name: x.name, caption: x.caption})}`;
      li.className = 'post tf'; li.dataset.owner = x.owner;
      li.innerHTML = `<a class="pava" href="${esc(href)}" tabindex="-1" aria-hidden="true">${window.Posts ? Posts.avaHtml(x) : ''}</a>
        <div class="pbody"><p class="phead"><a class="pwho" href="${esc(href)}">${name ? `<b>${esc(name)}</b> ` : ''}<span>@${esc(x.username)}</span></a></p>
          <p class="tlast">${esc(last)} <span class="ago">· ${ago(x.at)}</span></p></div>
        <div class="tfgo"></div>`;
      const b = document.createElement('button'); b.type = 'button'; b.className = 'btn follow'; li.querySelector('.tfgo').append(b);
      followButton(b, {id: x.owner, username: x.username});
      li.addEventListener('click', e => { if (!e.target.closest('a, button')) location.href = href; });
      return li;
    }));
    $('#none').append(box);
  }
  // Everyone, under it
  const more = await enrich(rows.slice(0, PAGE), run); if (!more || !more.length) return;
  const all = document.createElement('section'); all.className = 'tfall'; all.setAttribute('aria-labelledby', 'tfallH');
  all.innerHTML = '<h2 id="tfallH">Everyone <button class="more" type="button" data-scope="everyone">See all</button></h2><ol class="items"></ol>';
  all.querySelector('ol').append(...more.map(item));
  $('#none').append(all);
}
// Follow, the same as on People (u/ and people/: keep them in step): hover says Unfollow, and a click does it; a
// private profile is asked (Requested)
const LABEL = {none: 'Follow', following: 'Following', requested: 'Requested'}, UNDO = {following: 'Unfollow', requested: 'Cancel'};
function followButton(btn, person){
  let state = 'none', sure = 0, touch = false;
  const paint = undo => { btn.textContent = undo && UNDO[state] ? UNDO[state] : LABEL[state]; btn.setAttribute('aria-pressed', String(state !== 'none')); };
  paint(false);
  btn.onpointerdown = e => { touch = e.pointerType === 'touch'; };
  btn.onmouseenter = () => { if (!touch) paint(true); };
  btn.onmouseleave = () => { if (!sure) paint(false); };
  btn.onclick = async () => {
    if (state !== 'none' && touch && !sure){ sure = setTimeout(() => { sure = 0; paint(false); }, 3000); paint(true); return; }
    clearTimeout(sure); sure = 0; btn.disabled = true;
    try {
      state = await rpc(state === 'none' ? 'follow' : 'unfollow', {target: person.id});
      if (state === 'requested') toast('Request sent to @' + person.username + '.');
    } catch (err){ toast(friendly(err)); }
    finally { btn.disabled = false; paint(false); }
  };
}

const tabs = [...document.querySelectorAll('.tabs button')];
tabs.forEach(b => b.addEventListener('click', () => { if (b.dataset.scope !== feed.scope) show(b.dataset.scope); }));
// ← → move between the tabs
document.querySelector('.tabs').addEventListener('keydown', e => {
  const i = tabs.indexOf(document.activeElement); if (i < 0 || (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft')) return;
  const next = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length]; next.focus(); next.click();
});

// how tall the bar is, so the tabs stay just under it (the bar is two rows on a phone)
const bar = document.querySelector('header.top'), barh = () => document.documentElement.style.setProperty('--barh', bar.offsetHeight + 'px');
barh(); if ('ResizeObserver' in window) new ResizeObserver(barh).observe(bar);
// signed in with a username: "What did you watch or read?" at the top; a post goes on the feed at once
async function compose(){
  if (!me.profile || !window.Posts) return;
  $('#compose').hidden = false;
  await Posts.composer($('#compose'));
}
(async () => {
  await startSession();
  paintAcct();
  compose();
  show(asked || (me.user ? 'following' : 'everyone'));
})();
})();
</script>
