<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Find the real spine of any film or book, stack your shelf, see what friends are stacking.">
<script>
  /* The shelf builder used to be this page; it's in build/ now. Links made before the move keep working: a saved
     shelf (?open=<id>), the builder inside a profile (?embed, ?new), a Google sign-in on its way back (?code=, ?error=)
     and the builder's sections (#shelf #search #upload #mine #how) go on to build/ with the same query and hash. */
  (function(){
    var q = location.search, h = location.hash;
    if (/[?&](open|embed|new|code|error|error_description)(=|&|$)/.test(q) || /^#(shelf|search|upload|mine|how)$/.test(h)){
      document.documentElement.hidden = true;
      location.replace('build/' + q + h);
    }
  })();
</script>
<title>shelfstackd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;700;800&display=swap">
<style>
/* the site's own look, as in build/ and u/ */
:root{--paper:#FFFFFF;--ink:#000000;--grey:#6B6B6B;--hair:#D9D9D9;--mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 12px/1.55 var(--mono)}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.top{display:flex;justify-content:center;padding:14px 24px}
.mark{font-weight:800;font-size:22px;letter-spacing:.34em;margin-right:-.34em;line-height:1;text-decoration:none;text-transform:uppercase}
.col{max-width:600px;margin:0 auto;padding:56px 16px;text-align:center}
h1{font-size:24px;line-height:1.3;font-weight:700;text-transform:uppercase;margin:0 0 26px}
.btn{display:inline-block;font:500 13px var(--mono);text-transform:uppercase;text-decoration:none;background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:8px;padding:11px 22px;cursor:pointer}
.btn:hover{background:#222}
.dash{display:inline-block;padding:0 0 6px;font:500 12px var(--mono);text-transform:uppercase;color:var(--ink);text-decoration:none;
  background-image:repeating-linear-gradient(90deg,var(--ink) 0 8px,transparent 8px 11px);background-size:100% 3px;background-repeat:no-repeat;background-position:left bottom}
.more{margin-top:26px}
</style>
</head>
<body>
<header class="top">
  <a class="mark" href="./" aria-label="shelfstackd, home">SHELFSTACKD</a>
</header>

<!-- Step 1 only: this stands in until the real home page (step 2) replaces it. -->
<main class="col">
  <h1>Find the real spine of any film or book.</h1>
  <a class="btn" href="build/">Start a shelf</a>
  <p class="more"><a class="dash" href="feed/">Feed</a></p>
</main>
</body>
</html>
