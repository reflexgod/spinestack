<style>
/* notifications: one line each (or one for several in a row about the same thing), newest first; unread in bold */
.nlist{list-style:none;margin:var(--s5) 0 0;padding:0;display:grid;gap:var(--s4);max-width:680px}
.nlist li{display:grid;grid-template-columns:32px minmax(0,1fr);gap:var(--s1) var(--s4);align-items:center}
.nlist .fa{width:32px;height:32px;border-radius:50%;border:1px solid var(--ink);background:var(--wash);overflow:hidden;display:grid;place-items:center;font-size:var(--fs-body);text-transform:uppercase;text-decoration:none;color:var(--ink)}
.nlist .fa img{width:100%;height:100%;object-fit:cover;display:block}
.nlist .nl{margin:0;min-width:0;overflow-wrap:anywhere}
.nlist .nl a{text-decoration:none}
.nlist .nl a:hover,.nlist .nl a:focus-visible{text-decoration:underline;text-underline-offset:3px}
.nlist .unread .nl{font-weight:700}
.nlist .ago{color:var(--grey);font-size:var(--fs-small);font-weight:400;white-space:nowrap}
.nlist .nt{grid-column:2;margin:0;color:var(--grey);white-space:pre-line;overflow-wrap:anywhere}
#state{margin:var(--s5) 0 0}
#more{margin-top:var(--s5)}
</style>

<script>
(() => {
/* Notifications: /notifications/, yours only (migration 0009, notifications_list()). Likes, replies, Sames and new
   followers, newest first, 30 at a time; ones in a row about the same thing are one line ("@a and 2 others liked your
   log of Gummo"). A reply is its own line, with what was said. Each goes to the post (/p/) or, for a follower, their
   profile. Opening the page marks them all read (notifications_read()), and the bell's dot goes; what was unread
   until now is in bold. Signed out: Sign in. Without 0009: they aren't open yet. */
const $ = s => document.querySelector(s);
const WORKER = String(window.SPINESTACK_WORKER || '').trim().replace(/\/+$/, '');
const SB_URL = String(window.SPINESTACK_SUPABASE_URL || '').trim().replace(/\/+$/, ''), SB_KEY = String(window.SPINESTACK_SUPABASE_KEY || '').trim();
const SB_LIB = {src:'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js', integrity:'sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok'};
const PAGE = 30;
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT = 0; function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 4200); }
const friendly = e => Posts.friendly(e);

/* ---------- signing in (the same Supabase client and settings as the feed) ---------- */
const me = {sb:null, user:null, profile:null};
let sbLoading = null;
function supa(){
  return sbLoading || (sbLoading = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = SB_LIB.src; s.integrity = SB_LIB.integrity; s.crossOrigin = 'anonymous';
    s.onload = () => { me.sb = window.supabase.createClient(SB_URL, SB_KEY, {auth:{flowType:'pkce', persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}}); res(me.sb); };
    s.onerror = () => { sbLoading = null; s.remove(); rej(new Error('Sign-in couldn’t load. Check your connection and try again.')); };
    document.head.appendChild(s);
  }));
}
const hasSession = () => { try { return Object.keys(localStorage).some(k => /^sb-.+-auth-token$/.test(k)); } catch { return false; } };
const returning = () => /[?&](code|error|error_description)=/.test(location.search);
async function startSession(){
  const back = returning();
  if (!hasSession() && !back) return;
  try {
    const sb = await supa(), {data:{session}} = await sb.auth.getSession();
    if (back) history.replaceState(null, '', location.pathname);
    me.user = session && session.user;
    if (me.user){ const rows = await Posts.rest(`profiles?select=id,username,display_name,avatar_key&id=eq.${me.user.id}`); me.profile = rows[0] || null; }
    sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') location.reload(); });
  } catch (e){ if (me.user && !me.profile) me.unreachable = true; toast(friendly(e)); }
}
const signIn = () => openSheet('#signSheet', '#googleBtn');
Nav.onSignIn(signIn);
Nav.onSignOut(async () => { try { const {error} = await (await supa()).auth.signOut({scope: 'local'}); if (error) throw error; } catch (e){ toast(friendly(e)); } });
$('#googleBtn').addEventListener('click', async () => {
  const btn = $('#googleBtn'); btn.disabled = true;
  try { const sb = await supa(), {error} = await sb.auth.signInWithOAuth({provider:'google', options:{redirectTo: location.origin + location.pathname}}); if (error) throw error; }
  catch (e){ btn.disabled = false; toast(friendly(e)); }
});
let sheetFrom = null;
function openSheet(id, focus){ sheetFrom = document.activeElement; $(id).hidden = false; const f = $(focus); if (f) f.focus(); }
function closeSheets(){ document.querySelectorAll('.sheet').forEach(s => s.hidden = true); if (sheetFrom && sheetFrom.focus) sheetFrom.focus(); }
document.querySelectorAll('.sheet').forEach(s => s.addEventListener('click', e => { if (e.target === s || e.target.closest('[data-close]')) closeSheets(); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.querySelector('.sheet:not([hidden])')) closeSheets(); });
document.addEventListener('click', e => { if (e.target.closest('[data-signin]')) signIn(); });

/* ---------- the list ---------- */
const notes = {rows: [], last: null};
// ones in a row about the same thing (the same kind, and the same log) are one; a reply, and anything about a rec (0010), is always its own
function grouped(rows){
  const out = [];
  for (const n of rows){
    const g = out[out.length - 1];
    if (g && !ALONE.test(n.kind) && g.kind === n.kind && g.log === n.log && !g.who.some(w => w.actor === n.actor)) { g.who.push(n); g.unread = g.unread || !n.read; continue; }
    out.push({kind: n.kind, log: n.log, log_kind: n.log_kind, log_title: n.log_title, rec: n.rec, rec_kind: n.rec_kind, rec_title: n.rec_title, at: n.created_at, reply_text: n.reply_text, unread: !n.read, who: [n]});
  }
  return out;
}
const ALONE = /^(reply|rec|rec_watched|rec_reply)$/;
const DOES = {like: 'liked your log of', reply: 'replied to your log of', metoo: 'said Same to your log of', follow: 'followed you'};
// a rec (0010): it's on your profile's Recs tab, For you (one for you) or Sent (yours, watched)
const recsAt = hash => me.profile ? `../u/?${encodeURIComponent(me.profile.username)}${hash}` : '../u/';
function names(who){
  const at = w => `<a href="../u/?${esc(w.username)}">@${esc(w.username)}</a>`, n = who.length;
  return n === 1 ? at(who[0]) : n === 2 ? `${at(who[0])} and ${at(who[1])}` : `${at(who[0])} and ${n - 1} others`;
}
function line(g){
  const li = document.createElement('li'), first = g.who[0], post = g.log ? `../p/?${esc(g.log)}` : '';
  li.className = g.unread ? 'unread' : '';
  const ava = first.avatar_key ? `<img src="${esc(`${WORKER}/m/img?k=${encodeURIComponent(first.avatar_key)}`)}" alt="" loading="lazy">` : esc(((first.display_name || '').trim() || first.username || '·').trim()[0] || '·');
  const rt = `${esc(g.rec_title || 'a title')}`;
  const what = g.kind === 'rec' ? `recommended <a href="${esc(recsAt('#recs'))}">${rt}</a> to you`
    : g.kind === 'rec_watched' ? `${g.rec_kind === 'movie' ? 'watched' : 'read'} <a href="${esc(recsAt('#sent'))}">${rt}</a>, your rec`
    : g.kind === 'rec_reply' ? `replied about <a href="${esc(recsAt('#recs'))}">${rt}</a>`
    : g.kind === 'follow' ? DOES.follow
    : g.kind === 'metoo' ? `${DOES.metoo} <a href="${post}">${esc(g.log_title || 'it')}</a>`
    : `${DOES[g.kind]} <a href="${post}">${esc(g.log_title || 'a log')}</a>`;
  li.innerHTML = `<a class="fa" href="../u/?${esc(first.username)}" tabindex="-1" aria-hidden="true">${ava}</a>
    <p class="nl">${names(g.who)} ${what} <span class="ago">· <time datetime="${esc(g.at)}" title="${esc(new Date(g.at).toLocaleString())}">${Posts.ago(g.at)}</time></span></p>
    ${(g.kind === 'reply' || g.kind === 'rec_reply') && g.reply_text ? `<p class="nt">${esc(g.reply_text)}</p>` : ''}`;
  return li;
}
async function more(){
  const btn = $('#more'); btn.disabled = true;
  let rows;
  try { rows = await Posts.rpc('notifications_list', {before: notes.last ? notes.last.at : null, before_id: notes.last ? notes.last.id : null, n: PAGE}); }
  catch (e){ btn.disabled = false; $('#state').textContent = friendly(e); $('#state').hidden = false; return; }
  btn.disabled = false;
  notes.rows.push(...rows);
  const end = rows[rows.length - 1]; if (end) notes.last = {at: end.created_at, id: end.id};
  $('#nlist').replaceChildren(...grouped(notes.rows).map(line));
  $('#state').hidden = !!notes.rows.length; $('#state').textContent = 'Nothing yet.';
  btn.hidden = rows.length < PAGE;
}
$('#more').addEventListener('click', more);

(async () => {
  await startSession();
  Nav.paint(me);
  const st = $('#state');
  if (!me.user){ st.innerHTML = '<button class="linkish" type="button" data-signin>Sign in</button> to see yours.'; return; }
  if (!me.profile){ st.textContent = me.unreachable ? friendly(new Error('network')) : 'Pick a username first.'; return; }
  if (!(await Posts.ready())){ st.textContent = 'Notifications aren’t open yet.'; return; }
  await more();
  // seen now: all of them read, and the bell's dot goes (what was unread stays in bold on this page)
  try { await Posts.rpc('notifications_read', {}); document.dispatchEvent(new CustomEvent('shelfstackd:read')); } catch {}
})();
})();
</script>
</body>
