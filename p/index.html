<style>
/* a post's own page: the post (its review in full), then its replies, oldest first, and the box to reply in */
#thePost .cover{width:120px}   /* larger than on the feed: the post is the page */
#thePost,.replies{max-width:680px}   /* the column is the site's; the post and its replies keep to a reading width in it */
.vh{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0}   /* the heading for screen readers: the post's line says it on screen */
.back{display:block;width:max-content;color:var(--grey);font-size:var(--fs-small);text-decoration:none;margin-bottom:var(--s4)}   /* a block: 24px under the bar, as every page starts */
.back:hover,.back:focus-visible{color:var(--ink)}
#state{margin:var(--s5) 0 0}
.replies{margin-top:var(--s6)}
.rlist{list-style:none;margin:0;padding:0;display:grid;gap:var(--s4)}
.rlist li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:var(--s1) var(--s4);align-items:start}
.rlist .fa{width:28px;height:28px;border-radius:50%;border:1px solid var(--ink);background:var(--wash);overflow:hidden;display:grid;place-items:center;font-size:var(--fs-card);text-transform:uppercase;text-decoration:none;color:var(--ink)}
.rlist .fa img{width:100%;height:100%;object-fit:cover;display:block}
.rlist .rl{margin:0;min-width:0}
.rlist .rl a{font-weight:500;text-decoration:none}
.rlist .rl a:hover,.rlist .rl a:focus-visible{text-decoration:underline;text-underline-offset:3px}
.rlist .rt{grid-column:2;margin:0;white-space:pre-line;overflow-wrap:anywhere}
.rlist .pacts{margin:0}
.rnone{margin:0;color:var(--grey)}
.rbox{display:grid;gap:var(--s2);margin-top:var(--s5);padding-top:var(--s4);border-top:1px solid var(--hair)}
.rbox .row{display:flex;justify-content:space-between;align-items:center;gap:var(--s4)}
.rbox .note{margin:0}
</style>
</head>
<body>
<header class="top" id="top">
  <!-- icons: Lucide 1.49.0 (ISC), pasted in -->
  <a class="mark" href="../" aria-label="shelfstackd, home">SHELFSTACKD</a>
  <button class="acct" id="acctBtn" type="button" aria-haspopup="menu" aria-expanded="false" hidden><span class="ava" aria-hidden="true"></span><span class="who"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
  <nav class="links" aria-label="shelfstackd">
    <a href="../feed/">Feed</a>
    <a href="../shelves/">Shelves</a><a href="../people/">People</a>
    <a class="find" href="../people/" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg></a>
    <a class="bell" id="bell" href="../notifications/" aria-label="Notifications" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg><span class="dot" hidden></span></a>
  </nav>
  <a class="signin" id="signInBtn" href="#" hidden>Sign in</a>
  <span class="addwrap"><a class="btn primary add" href="../build/" aria-label="Add a film or a book"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg><span>Add</span></a><button class="btn primary addmore" id="addMore" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="More ways to add" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></span>

<main class="postpage">
  <a class="back" href="../feed/">Back to the feed</a>
  <h1 class="vh" id="heading">Post</h1>
  <p class="grey" id="state" role="status">Loading…</p>

      <div class="row"><p class="note grey" id="rsay" role="status"></p><button class="btn primary" id="rgo" type="submit">Reply</button></div>
    </form>
    <p class="note" id="rsign" hidden><button class="linkish" type="button" data-signin>Sign in</button> to reply.</p>
  </section>
</main>

  <div class="sheetbox">
    <button class="x" data-close type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    <div>
      <h2>Sign in</h2>
      <p></p>
      <button class="btn primary full" id="googleBtn" type="button">Continue with Google</button>
      <p class="note">Accounts are for people 18 or older. <a href="../privacy.html">Privacy</a></p>
    </div>
  </div>
</div>

</footer>

<script src="../shelf.js?v=20261002a"></script>

<script>
(() => {
/* A post's own page: /p/?<log id>. The post as the feed shows it, with its review in full, then (with migration 0009)
   its replies, oldest first (replies_of()), and a box to reply in at the bottom (280 characters). Your own reply, or
   any reply to your post, has Delete (after a yes); someone else's has Report. A post you can't see (deleted, or a
   private profile's you don't follow) says so. #reply puts the caret in the box. */
const $ = s => document.querySelector(s);
const WORKER = String(window.SPINESTACK_WORKER || '').trim().replace(/\/+$/, '');
const SB_URL = String(window.SPINESTACK_SUPABASE_URL || '').trim().replace(/\/+$/, ''), SB_KEY = String(window.SPINESTACK_SUPABASE_KEY || '').trim();
const SB_LIB = {src:'../vendor/@supabase/supabase-js@2.117.2/dist/umd/supabase.js', integrity:'sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok'};
const ID = (location.search.slice(1).split('&')[0] || '').toLowerCase();
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT = 0; function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 4200); }
const friendly = e => window.Posts ? Posts.friendly(e) : 'Something went wrong. Try again in a moment.';

/* ---------- signing in (the same Supabase client and settings as the feed) ---------- */
const me = {sb:null, user:null, profile:null};
let sbLoading = null;
function supa(){
  return sbLoading || (sbLoading = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = SB_LIB.src; s.integrity = SB_LIB.integrity; s.crossOrigin = 'anonymous';
    s.onload = () => { me.sb = window.supabase.createClient(SB_URL, SB_KEY, {auth:{flowType:'pkce', persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}}); res(me.sb); };
    s.onerror = () => { sbLoading = null; s.remove(); rej(new Error('Sign-in couldn’t load. Check your connection and try again.')); };
    document.head.appendChild(s);
  }));
}
const hasSession = () => { try { return Object.keys(localStorage).some(k => /^sb-.+-auth-token$/.test(k)); } catch { return false; } };
const returning = () => /[?&](code|error|error_description)=/.test(location.search);
async function startSession(){
  const back = returning();
  if (!hasSession() && !back) return;
  try {
    const sb = await supa(), {data:{session}} = await sb.auth.getSession();
    if (back) history.replaceState(null, '', location.pathname + '?' + ID + location.hash);
    me.user = session && session.user;
    if (me.user){ const rows = await Posts.rest(`profiles?select=id,username,display_name,avatar_key&id=eq.${me.user.id}`); me.profile = rows[0] || null; }
    sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') location.reload(); });
  } catch (e){ if (me.user && !me.profile) me.unreachable = true; toast(friendly(e)); }
}
const signIn = () => openSheet('#signSheet', '#googleBtn');
Nav.onSignIn(signIn);
Nav.onSignOut(async () => { try { const {error} = await (await supa()).auth.signOut({scope: 'local'}); if (error) throw error; } catch (e){ toast(friendly(e)); } });
$('#googleBtn').addEventListener('click', async () => {
  const btn = $('#googleBtn'); btn.disabled = true;
  try { const sb = await supa(), {error} = await sb.auth.signInWithOAuth({provider:'google', options:{redirectTo: location.origin + location.pathname + '?' + ID}}); if (error) throw error; }
  catch (e){ btn.disabled = false; toast(friendly(e)); }
});
let sheetFrom = null;
function openSheet(id, focus){ sheetFrom = document.activeElement; $(id).hidden = false; const f = $(focus); if (f) f.focus(); }
function closeSheets(){ document.querySelectorAll('.sheet').forEach(s => s.hidden = true); if (sheetFrom && sheetFrom.focus) sheetFrom.focus(); }
document.querySelectorAll('.sheet').forEach(s => s.addEventListener('click', e => { if (e.target === s || e.target.closest('[data-close]')) closeSheets(); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.querySelector('.sheet:not([hidden])')) closeSheets(); });
document.addEventListener('click', e => { if (e.target.closest('[data-signin]')) signIn(); });

/* ---------- the post ---------- */
const post = {x: null, social: false};
async function load(){
  if (!/^[0-9a-f-]{36}$/.test(ID)){ gone(); return; }
  let x = null;
  try {
    const rows = await Posts.rest(`logs?select=id,owner,kind,title,author,year,cover_src,caption,created_at&id=eq.${ID}`);
    if (rows && rows[0]){
      const l = rows[0], ps = await Posts.rest(`profiles?select=id,username,display_name,avatar_key&id=eq.${l.owner}`), p = ps && ps[0];
      if (p) x = {...l, what: 'log', at: l.created_at, username: p.username, display_name: p.display_name, avatar_key: p.avatar_key};
    }
  } catch (e){ $('#state').textContent = friendly(e); return; }
  if (!x){ gone(); return; }
  post.social = await Posts.ready();
  try { const st = await Posts.stats([x.id]); if (st.has(x.id)) x = {...x, ...st.get(x.id)}; } catch {}
  post.x = x;
  const verb = Posts.verb(x.kind), line = `@${x.username} ${verb} ${x.title}`;
  document.title = `${line} · shelfstackd`;
  $('#heading').textContent = line;
  $('#state').hidden = true;
  $('#thePost').replaceChildren(Posts.item(x, {social: post.social, whole: true, cover: 120, onGone: () => { location.href = '../feed/'; }}));
  if (post.social) replies();
  // your own log from before ids were kept: its id, once the Worker finds the title (0011)
  if (me.user && x.owner === me.user.id) Nav.fillIds([{table: 'logs', id: x.id, kind: x.kind, title: x.title, year: x.year, tmdb_id: x.tmdb_id, ol_id: x.ol_id}]);
}
function gone(){ $('#state').textContent = 'This post isn’t here. It was deleted, or it’s a private profile’s.'; $('#state').hidden = false; }

/* ---------- replies ---------- */
const ava = r => r.avatar_key ? `<img src="${esc(`${WORKER}/m/img?k=${encodeURIComponent(r.avatar_key)}`)}" alt="" loading="lazy">` : esc(((r.display_name || '').trim() || r.username || '·').trim()[0] || '·');
function replyLi(r){
  const li = document.createElement('li'), mine = !!(me.user && r.owner === me.user.id), theirPost = !!(me.user && post.x.owner === me.user.id);
  li.dataset.id = r.id;
  li.innerHTML = `<a class="fa" href="../u/?${esc(r.username)}" tabindex="-1" aria-hidden="true">${ava(r)}</a>
    <p class="rl"><a href="../u/?${esc(r.username)}">@${esc(r.username)}</a> <span class="ago">· <time datetime="${esc(r.created_at)}" title="${esc(new Date(r.created_at).toLocaleString())}">${Posts.ago(r.created_at)}</time></span></p>
    <p class="rt">${esc(r.text)}</p>
    <div class="pacts">${mine || theirPost ? `<button type="button" data-del>Delete</button>` : me.user ? `<button type="button" data-report>Report</button>` : ''}</div>`;
  return li;
}
let lastReply = null;
async function replies(){
  $('#replies').hidden = false;
  let rows = [];
  try { rows = await Posts.rpc('replies_of', {lid: post.x.id}); } catch (e){ $('#rnone').textContent = friendly(e); $('#rnone').hidden = false; }
  $('#rlist').replaceChildren(...(rows || []).map(replyLi));
  $('#rnone').hidden = !!$('#rlist').children.length;
  const can = !!me.profile;
  $('#rbox').hidden = !can; $('#rsign').hidden = can || !!me.user;
  if (can && location.hash === '#reply') $('#reply').focus();
}
// a count on the post's own row, kept in step as replies come and go
function bump(n){
  const a = document.querySelector('#thePost .pacts .reply'); if (!a || !post.x) return;
  post.x.replies = Math.max(0, (post.x.replies || 0) + n);
  a.querySelector('.n').textContent = post.x.replies || '';
  a.setAttribute('aria-label', `Reply. ${post.x.replies} repl${post.x.replies === 1 ? 'y' : 'ies'}`);
}
$('#reply').addEventListener('input', () => { $('#rsay').textContent = $('#reply').value.length > 240 ? `${$('#reply').value.length} / 280` : ''; });
$('#rbox').addEventListener('submit', async e => {
  e.preventDefault();
  const text = $('#reply').value.trim(); if (!text || !post.x) return;
  const go = $('#rgo'); go.disabled = true; $('#rsay').textContent = 'Replying…';
  let r;
  try { r = await me.sb.from('replies').insert({log: post.x.id, text: text.slice(0, 280)}).select('id,created_at').single(); } catch (err){ r = {error: err}; }
  go.disabled = false;
  if (r.error){ $('#rsay').textContent = friendly(r.error); return; }
  $('#rsay').textContent = ''; $('#reply').value = '';
  const p = me.profile;
  $('#rlist').append(replyLi({id: r.data.id, created_at: r.data.created_at || new Date().toISOString(), text, owner: p.id, username: p.username, display_name: p.display_name, avatar_key: p.avatar_key}));
  $('#rnone').hidden = true; bump(1);
});
$('#rlist').addEventListener('click', async e => {
  const li = e.target.closest('li'); if (!li) return;
  if (e.target.closest('[data-del]')){
    if (!(await Posts.ask({text: 'Delete this reply?', yes: 'Delete'}))) return;
    let r; try { r = await me.sb.from('replies').delete().eq('id', li.dataset.id); } catch (err){ r = {error: err}; }
    if (r.error){ toast(friendly(r.error)); return; }
    li.remove(); bump(-1); $('#rnone').hidden = !!$('#rlist').children.length; toast('Deleted.');
  } else if (e.target.closest('[data-report]')){
    const b = e.target.closest('[data-report]'), said = await Posts.report('reply', li.dataset.id);
    toast(said); if (said === 'Reported. Thanks.'){ b.disabled = true; b.textContent = 'Reported'; }
  }
});

(async () => {
  await startSession();
  Nav.paint(me);
  await load();
})();
})();
</script>
</body>
</html>
