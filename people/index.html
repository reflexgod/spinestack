<style>
/* members: a box to find someone, the people found, then who has been shelving lately (site.css has the rows of
   people, the round photos and the rest) */
.findbox{display:flex;gap:var(--s2);align-items:end;max-width:420px}
.findbox .field{flex:1}

<body>
<header class="top" id="top">
  <!-- icons: Lucide 1.49.0 (ISC), pasted in -->
  <a class="mark" href="../" aria-label="shelfstackd, home"><img src="../assets/logo-hedgehog.svg" width="28" height="28" alt="">SHELFSTACKD</a>
  <button class="acct" id="acctBtn" type="button" aria-haspopup="menu" aria-expanded="false" hidden><span class="ava" aria-hidden="true"></span><span class="who"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>

    <label class="field"><span class="lbl">Find @username</span><input type="text" id="q" maxlength="41" placeholder="a username or a name" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="search"></label>

<script>
(() => {
/* People: /people/ (/members/, its old address, comes here; ?q=<what was typed> keeps a search on reload). "Find @username" asks find_people() (0006) for
   people whose username or display name starts with what's typed, 300 ms after the last key; each one found has
   FOLLOW / FOLLOWING / REQUESTED, the same as on a profile. Under it, Recently active: the people behind the latest
   50 public shelves, each once. */
const $ = s => document.querySelector(s);
const WORKER = String(window.SPINESTACK_WORKER || '').trim().replace(/\/+$/, '');
const SB_URL = String(window.SPINESTACK_SUPABASE_URL || '').trim().replace(/\/+$/, ''), SB_KEY = String(window.SPINESTACK_SUPABASE_KEY || '').trim();
const SB_LIB = {src:'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js', integrity:'sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok'};
const WAIT = 300;   // ms after the last key before the search goes out

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const profileUrl = name => '../u/?' + name;
const avatarSrc = k => `${WORKER}/m/img?k=${encodeURIComponent(k)}`;
let toastT = 0; function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 4200); }
function friendly(e){
  const m = (e && e.message) || '';
  if (/fetch|network/i.test(m)) return 'Couldn’t reach shelfstackd. Check your connection and try again.';
  return m || 'Something went wrong. Try again in a moment.';
}

/* ---------- signing in (the same Supabase client and settings as feed/ and u/) ---------- */
const me = {sb:null, user:null, profile:null};
let sbLoading = null;
function supa(){
  return sbLoading || (sbLoading = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = SB_LIB.src; s.integrity = SB_LIB.integrity; s.crossOrigin = 'anonymous';
    s.onload = () => { me.sb = window.supabase.createClient(SB_URL, SB_KEY, {auth:{flowType:'pkce', persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}}); res(me.sb); };
    s.onerror = () => { sbLoading = null; s.remove(); rej(new Error('Sign-in couldn’t load. Check your connection and try again.')); };
    document.head.appendChild(s);
  }));
}
const hasSession = () => { try { return Object.keys(localStorage).some(k => /^sb-.+-auth-token$/.test(k)); } catch { return false; } };
const returning = () => /[?&](code|error|error_description)=/.test(location.search);
const asked = () => (new URLSearchParams(location.search).get('q') || '').slice(0, 41);
const here = q => location.pathname + (q ? '?q=' + encodeURIComponent(q) : '');
async function token(){
  if (!me.sb) return null;
  const {data:{session}} = await me.sb.auth.getSession();
  return session ? session.access_token : null;
}
// Supabase's REST API: as the signed-in person when there is one, otherwise as a visitor
async function api(path, opt = {}){
  const t = await token(), r = await fetch(`${SB_URL}/rest/v1/${path}`, {...opt,
    headers: {apikey: SB_KEY, 'Content-Type': 'application/json', ...(t ? {Authorization: 'Bearer ' + t} : {}), ...(opt.headers || {})}});
  const j = r.status === 204 ? null : await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && j.message) || 'Couldn’t load the members. Try again in a moment.');
  return j;
}
const rpc = (fn, args) => api('rpc/' + fn, {method:'POST', body: JSON.stringify(args)});
async function startSession(){
  const back = returning(), q = asked();   // asked before Supabase takes ?code= off
  if (!hasSession() && !back) return;
  try {
    const err = new URLSearchParams(location.search).get('error_description');
    const sb = await supa(), {data:{session}} = await sb.auth.getSession();   // finishes a Google sign-in coming back with ?code=
    if (back) history.replaceState(null, '', here(q) + location.hash);
    if (err) toast('Sign-in didn’t finish: ' + err);
    me.user = session && session.user;
    if (me.user){
      const rows = await api(`profiles?select=id,username,display_name,avatar_key&id=eq.${me.user.id}`);
      me.profile = rows[0] || null;
    }
    sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') location.reload(); });
  } catch (e){ if (me.user && !me.profile) me.unreachable = true; toast(friendly(e)); }   // unreachable: signed in, but the account couldn't be read (not "no username yet")
}
const signIn = () => openSheet('#signSheet', '#googleBtn');
Nav.onSignIn(signIn);
// Sign out, from the account menu (nav.js): the page starts again signed out
Nav.onSignOut(async () => { try { const {error} = await (await supa()).auth.signOut({scope: 'local'}); if (error) throw error; } catch (e){ toast(friendly(e)); } });
$('#googleBtn').addEventListener('click', async () => {
  const btn = $('#googleBtn'); btn.disabled = true;
  try {
    const sb = await supa();
    const {error} = await sb.auth.signInWithOAuth({provider:'google', options:{redirectTo: location.origin + here($('#q').value.trim())}});   // back to this search
    if (error) throw error;
  } catch (e){ btn.disabled = false; toast(friendly(e)); }
});

/* sheets */
let sheetFrom = null;
function openSheet(id, focus){ sheetFrom = document.activeElement; $(id).hidden = false; const f = $(focus); if (f) f.focus(); }
function closeSheets(){ document.querySelectorAll('.sheet').forEach(s => s.hidden = true); if (sheetFrom && sheetFrom.focus) sheetFrom.focus(); }
document.querySelectorAll('.sheet').forEach(s => s.addEventListener('click', e => { if (e.target === s || e.target.closest('[data-close]')) closeSheets(); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.querySelector('.sheet:not([hidden])')) closeSheets(); });

/* ---------- following (the same as on a profile, u/: keep the two in step) ---------- */
// FOLLOW pressed while signed out waits here until you're back from signing in
const PENDING = 'shelfstackd-follow';
const pendingFollow = () => { try { const v = JSON.parse(sessionStorage.getItem(PENDING) || 'null'); return v && Date.now() - v.at < 30*60e3 ? v : null; } catch { return null; } };
const keepFollow = x => { try { sessionStorage.setItem(PENDING, JSON.stringify({id: x.id, username: x.username, at: Date.now()})); } catch {} };
const dropFollow = () => { try { sessionStorage.removeItem(PENDING); } catch {} };
// 'none', 'following', or 'requested' (a private profile that hasn't answered yet)
const stateOf = x => x.i_follow ? 'following' : x.i_requested ? 'requested' : 'none';
const LABEL = {none: 'Follow', following: 'Following', requested: 'Requested'}, UNDO = {following: 'Unfollow', requested: 'Cancel'};
function followButton(btn, person){
  // hover shows UNFOLLOW (or CANCEL) and a click does it; on a phone the first tap shows it and a second one does it
  let state = stateOf(person), sure = 0, touch = false;
  const paint = undo => { btn.textContent = undo && UNDO[state] ? UNDO[state] : LABEL[state]; btn.setAttribute('aria-pressed', String(state !== 'none')); };
  paint(false);
  btn.onpointerdown = e => { touch = e.pointerType === 'touch'; };
  btn.onmouseenter = () => { if (!touch) paint(true); };
  btn.onmouseleave = () => { if (!sure) paint(false); };
  btn.onclick = async () => {
    if (!me.user){ keepFollow(person); signIn(); toast('Sign in to follow @' + person.username + '.'); return; }
    if (!me.profile && me.unreachable){ toast(friendly(new Error('network'))); return; }
    if (!me.profile){ keepFollow(person); toast('Pick a username first.'); setTimeout(() => { location.href = '../build/'; }, 900); return; }
    if (state !== 'none' && touch && !sure){ sure = setTimeout(() => { sure = 0; paint(false); }, 3000); paint(true); return; }
    clearTimeout(sure); sure = 0; btn.disabled = true;
    try {
      state = await rpc(state === 'none' ? 'follow' : 'unfollow', {target: person.id});
      person.i_follow = state === 'following'; person.i_requested = state === 'requested';
      if (state === 'requested') toast('Request sent to @' + person.username + '.');
    } catch (err){ toast(friendly(err)); }
    finally { btn.disabled = false; paint(false); }
  };
}
// a FOLLOW pressed before signing in, finished now. true when it followed (or asked to).
async function finishFollow(){
  const pf = pendingFollow();
  if (!pf || !me.user || !me.profile || pf.id === me.user.id) return false;
  dropFollow();
  try {
    const st = await rpc('follow', {target: pf.id});
    toast(st === 'requested' ? 'Request sent to @' + pf.username + '.' : 'You follow @' + pf.username + ' now.');
    return true;
  } catch (err){ toast(friendly(err)); return false; }
}

/* ---------- Find @username ---------- */
// one person found: photo, display name, @username, and FOLLOW (not beside yourself)
function personRow(x){
  const li = document.createElement('li'), name = (x.display_name || '').trim(), href = profileUrl(x.username);
  li.className = 'person';
  li.innerHTML = `<a class="pa" href="${esc(href)}" tabindex="-1" aria-hidden="true">${x.avatar_key ? `<img src="${esc(avatarSrc(x.avatar_key))}" alt="" loading="lazy">` : esc((name || x.username).trim()[0] || '·')}</a>
    <a class="pn" href="${esc(href)}"><b>${esc(name || '@' + x.username)}</b><span>@${esc(x.username)}</span></a><div class="acts"></div>`;
  if (!me.user || x.id !== me.user.id){
    const b = document.createElement('button'); b.type = 'button'; b.className = 'btn follow'; li.querySelector('.acts').append(b);
    followButton(b, x);
  }
  return li;
}
const find = {run: 0, t: 0, shown: null};
// as every search on the site: the username or name as typed first, then those starting with it, then the rest
function closestFirst(rows, q){
  const w = q.replace(/^@+/, '').toLowerCase(), how = p => { const u = (p.username || '').toLowerCase(), n = (p.display_name || '').toLowerCase();
    return u === w || n === w ? 0 : u.startsWith(w) || n.startsWith(w) ? 1 : 2; };
  return rows.map((p, i) => ({p, i, c: how(p)})).sort((a, b) => a.c - b.c || a.i - b.i).map(x => x.p);
}
async function search(q){
  const run = ++find.run, state = $('#findState'), list = $('#found');
  clearTimeout(find.t);
  q = q.trim();
  history.replaceState(null, '', here(q));
  if (!q.replace(/^@+/, '')){ find.shown = null; list.replaceChildren(); state.hidden = true; return; }
  if (!list.children.length){ state.textContent = 'Looking…'; state.hidden = false; }
  let rows;
  try { rows = await rpc('find_people', {q}); }
  catch (e){ if (run !== find.run) return; list.replaceChildren(); state.textContent = friendly(e); state.hidden = false; return; }
  if (run !== find.run) return;   // something else was typed meanwhile
  find.shown = q;
  rows = closestFirst(rows, q);
  list.replaceChildren(...rows.map(personRow));
  state.textContent = rows.length ? '' : `No one called “${q}”.`; state.hidden = !!rows.length;
}
$('#q').addEventListener('input', e => { clearTimeout(find.t); const q = e.target.value; find.t = setTimeout(() => search(q), WAIT); });
$('#findForm').addEventListener('submit', e => { e.preventDefault(); search($('#q').value); });   // Enter: at once

/* ---------- Recently active: the people behind the newest shelves, each once ---------- */
function person(x){
  const li = document.createElement('li'), name = (x.display_name || '').trim();
  li.innerHTML = `<a href="${esc(profileUrl(x.username))}"><span class="fa" aria-hidden="true">${x.avatar_key ? `<img src="${esc(avatarSrc(x.avatar_key))}" alt="" loading="lazy">` : esc((name || x.username).trim()[0] || '·')}</span><span>@${esc(x.username)}</span></a>`;
  return li;
}
async function showActive(){
  let rows;
  try { rows = await rpc('feed', {scope: 'everyone', before: null, before_id: null, n: 50}); }
  catch (e){ $('#activeState').textContent = friendly(e); return; }
  const seen = new Set(), who = rows.filter(x => !seen.has(x.owner) && seen.add(x.owner));
  $('#active').replaceChildren(...who.map(person));
  $('#activeState').textContent = 'No one here yet.'; $('#activeState').hidden = !!who.length;
}

showActive();   // doesn't wait on the account
(async () => {
  const q = asked();   // before a sign-in coming back is tidied out of the address
  await startSession();
  Nav.paint(me);
  await finishFollow();   // first, so the search below shows FOLLOWING
  if (q){ $('#q').value = q; search(q); }
})();
})();
</script>
