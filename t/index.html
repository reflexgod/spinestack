<style>
/* a title's page: the cover at the left (worn when you've logged it), what it is in the middle, what you can do with it
   at the right; then whose shelves it's on, and the reviews */
#state{margin:var(--s5) 0 0}
.thead{display:grid;grid-template-columns:160px minmax(0,1fr) 200px;gap:var(--s5);align-items:start}
.tcover{line-height:0}
.tcover canvas,.tcover img{display:block;width:100%;height:auto;aspect-ratio:2/3;object-fit:cover;background:var(--wash)}
.tcover .blank{display:block;width:100%;aspect-ratio:2/3;background:var(--wash)}
.tinfo{min-width:0}
.tinfo h1{margin:0 0 var(--s1)}
.tinfo h1 span{color:var(--grey)}
.tby,.tgenres{margin:0;color:var(--grey)}
.tgenres:empty,.tby:empty,.tabout:empty{display:none}
.tabout{margin:var(--s4) 0 0;max-width:60ch}
.tspine{display:flex;align-items:flex-end;gap:var(--s4);margin-top:var(--s4)}
.tspine img{display:block;height:120px;width:auto;outline:1px solid var(--hair);outline-offset:-1px}
/* how people rated it: the average as spines, the ten halves as a small histogram, and who watched it */
.tstats{display:grid;gap:var(--s2);margin-top:var(--s5)}
.tavg{display:flex;align-items:center;gap:var(--s2);margin:0}
.tavg .grey{font-size:var(--fs-small)}
.hist{display:flex;align-items:flex-end;gap:var(--s1);height:40px;width:160px;border-bottom:1px solid var(--ink);margin:0;padding:0;list-style:none}
.hist li{flex:1;background:var(--ink);min-height:1px}
.hist li[data-n="0"]{background:var(--hair)}
.twho{margin:0;color:var(--grey);font-size:var(--fs-small)}
/* the panel: one press each, or how it stands, in grey */
.tpanel{display:grid;gap:var(--s2);justify-items:start}
.tpanel .state{display:inline-flex;align-items:center;gap:var(--s1);color:var(--grey);font:600 var(--fs-btn)/1.35 var(--mono);padding:var(--s1) 0}
.tpanel .state svg{width:16px;height:16px}
.tpanel .state a{color:inherit}
.tpanel .pmenuwrap{position:relative}
section.tsec{margin-top:var(--s6)}
.tava{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:var(--s2)}
.tava a{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--ink);background:var(--wash);overflow:hidden;text-decoration:none;color:var(--ink);text-transform:uppercase}
.tava img{width:100%;height:100%;object-fit:cover;display:block}
.tmore{margin:var(--s2) 0 0;color:var(--grey);font-size:var(--fs-small)}
/* your review: one press on the spines rates it; then the review, if you like, and Post */
#yours{margin-bottom:var(--s5);padding-bottom:var(--s4);border-bottom:1px solid var(--hair)}
#yours:not(.rated) .psay,#yours:not(.rated) .popts,#yours:not(.rated) .ybar{display:none}
#yours .ybar{display:flex;justify-content:flex-end;align-items:center;gap:var(--s4);margin-top:var(--s2)}
#yours .ybar .note{margin:0}
#revs{max-width:600px}
@media (max-width:640px){
  .thead{grid-template-columns:120px minmax(0,1fr)}
  .tpanel{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);align-items:center}
}
</style>

<script>
(() => {
/* A film or a book: /t/?film=<TMDB id> or /t/?book=<Open Library work id>. From the Worker's /title: the cover, the
   title and year, the director or author, the runtime or pages, the genres, a short overview, and its real spine when
   the archive has one. A link from a log or a spine (which keep no id) is /t/?kind=&title=&year=: the Worker finds the
   id and the address becomes the id's; with no Worker, the page goes on with what the link says.
   Then what people here did with it, read from the logs and the spines with that kind, title and year that you can
   see: the average rating (in spines), the ten half-points as a histogram, "watched by 12 · 3 friends", the shelves
   it's on (people you follow first, 12 faces at most), and the reviews: Friends · Popular · Recent, each a post as the
   feed has it (a press goes to its page). Signed in and not logged yet: Your review at the top, one press on the
   spines to rate it, then the review if you like, and Post.
   At the right: Log (or "Logged Oct 2"), Put on shelf (or "On your shelf"), Add to Up next (or "In Up next"),
   Recommend (with 0010), Share. */
const $ = s => document.querySelector(s);
const WORKER = String(window.SPINESTACK_WORKER || '').trim().replace(/\/+$/, '');
const SB_URL = String(window.SPINESTACK_SUPABASE_URL || '').trim().replace(/\/+$/, ''), SB_KEY = String(window.SPINESTACK_SUPABASE_KEY || '').trim();
const SB_LIB = {src:'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js', integrity:'sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok'};
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT = 0; function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 4200); }
const friendly = e => window.Posts ? Posts.friendly(e) : 'Something went wrong. Try again in a moment.';
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
const SHARE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v13"/><path d="m16 6-4-4-4 4"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/></svg>';

/* ---------- which title ---------- */
const P = new URLSearchParams(location.search);
/* The address has its id (film, book) when it's known, and the title and year the link came with: logs and spines
   keep no id, so what people did with it is found by that title and year (until ids are kept: 0011) */
const ASK = (() => {
  const film = /^\d{1,9}$/.test(P.get('film') || '') ? P.get('film') : '', book = film ? '' : /^OL\d{1,10}W$/.test(P.get('book') || '') ? P.get('book') : '';
  const title = (P.get('title') || '').trim().slice(0, 200), year = /^\d{4}$/.test(P.get('year') || '') ? P.get('year') : '';
  return film || book || title ? {kind: film ? 'movie' : book ? 'book' : P.get('kind') === 'book' ? 'book' : 'movie', film, book, title, year} : null;
})();
const here = () => { const q = new URLSearchParams(location.search); for (const k of ['code', 'error', 'error_description', 'state']) q.delete(k); return location.pathname + '?' + q; };

/* ---------- signing in (the same Supabase client and settings as the feed) ---------- */
const me = {sb:null, user:null, profile:null};
let sbLoading = null;
function supa(){
  return sbLoading || (sbLoading = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = SB_LIB.src; s.integrity = SB_LIB.integrity; s.crossOrigin = 'anonymous';
    s.onload = () => { me.sb = window.supabase.createClient(SB_URL, SB_KEY, {auth:{flowType:'pkce', persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}}); res(me.sb); };
    s.onerror = () => { sbLoading = null; s.remove(); rej(new Error('Sign-in couldn’t load. Check your connection and try again.')); };
    document.head.appendChild(s);
  }));
}
const hasSession = () => { try { return Object.keys(localStorage).some(k => /^sb-.+-auth-token$/.test(k)); } catch { return false; } };
const returning = () => /[?&](code|error|error_description)=/.test(location.search);
async function startSession(){
  const back = returning();
  if (!hasSession() && !back) return;
  try {
    const sb = await supa(), {data:{session}} = await sb.auth.getSession();
    if (back) history.replaceState(null, '', here() + location.hash);
    me.user = session && session.user;
    if (me.user){ const rows = await Posts.rest(`profiles?select=id,username,display_name,avatar_key&id=eq.${me.user.id}`); me.profile = rows[0] || null; }
    sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') location.reload(); });
  } catch (e){ if (me.user && !me.profile) me.unreachable = true; toast(friendly(e)); }
}
const signIn = () => openSheet('#signSheet', '#googleBtn');
Nav.onSignIn(signIn);
Nav.onSignOut(async () => { try { const {error} = await (await supa()).auth.signOut({scope: 'local'}); if (error) throw error; } catch (e){ toast(friendly(e)); } });
$('#googleBtn').addEventListener('click', async () => {
  const btn = $('#googleBtn'); btn.disabled = true;
  try { const sb = await supa(), {error} = await sb.auth.signInWithOAuth({provider:'google', options:{redirectTo: location.origin + here()}}); if (error) throw error; }
  catch (e){ btn.disabled = false; toast(friendly(e)); }
});
let sheetFrom = null;
function openSheet(id, focus){ sheetFrom = document.activeElement; $(id).hidden = false; const f = $(focus); if (f) f.focus(); }
function closeSheets(){ document.querySelectorAll('.sheet').forEach(s => s.hidden = true); if (sheetFrom && sheetFrom.focus) sheetFrom.focus(); }
document.querySelectorAll('.sheet').forEach(s => s.addEventListener('click', e => { if (e.target === s || e.target.closest('[data-close]')) closeSheets(); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.querySelector('.sheet:not([hidden])')) closeSheets(); });

/* ---------- what it is ---------- */
const T = {info: null, item: null, logs: [], mine: null, friends: new Set(), shelves: [], tab: '', social: false};
// what the Worker says (null when it doesn't answer or doesn't know it)
async function info(){
  const q = ASK.film ? `film=${ASK.film}` : ASK.book ? `book=${ASK.book}` : new URLSearchParams({kind: ASK.kind, title: ASK.title, ...(ASK.year ? {year: ASK.year} : {})});
  try {
    const r = await fetch(`${WORKER}/title?${q}`);
    if (r.ok){ const j = await r.json(); if (j && j.title && j.kind === ASK.kind) return j; }
  } catch {}
  return null;
}
// what the link says, drawn at once
const fromLink = () => ({kind: ASK.kind, id: ASK.film || ASK.book, title: ASK.title, year: ASK.year, creator: '', runtime: null, pages: null, genres: [], overview: '', cover: '', spine: ''});
// this title's address: its id when known, with the title and year to find it by
function addressOf(){
  const q = new URLSearchParams(), id = T.info.id;
  if (id) q.set(T.info.kind === 'movie' ? 'film' : 'book', id); else q.set('kind', T.match.kind);
  q.set('title', T.match.title); if (T.match.year) q.set('year', T.match.year);
  return location.pathname + '?' + q;
}
const COVER_OK = /^https:\/\/(image\.tmdb\.org|covers\.openlibrary\.org)\/\S+$/;
const viaWorker = u => u ? `${WORKER}/img?url=${encodeURIComponent(u)}` : '';
const DATE = new Intl.DateTimeFormat(undefined, {day: 'numeric', month: 'short'}), DATEY = new Intl.DateTimeFormat(undefined, {day: 'numeric', month: 'short', year: 'numeric'});
const dated = t => (new Date(t).getFullYear() === new Date().getFullYear() ? DATE : DATEY).format(new Date(t));
const verb = k => k === 'movie' ? 'watched' : 'read';
function paintInfo(){
  const t = T.info, label = `${t.title}${t.year ? ` (${t.year})` : ''}`;
  document.title = `${label} · shelfstackd`;
  $('#tName').innerHTML = `${esc(t.title)}${t.year ? ` <span>${esc(t.year)}</span>` : ''}`;
  const by = t.creator ? (t.kind === 'movie' ? `Directed by ${t.creator}` : `by ${t.creator}`) : '';
  const long = t.kind === 'movie' ? (t.runtime ? `${t.runtime} min` : '') : (t.pages ? `${t.pages} pages` : '');
  $('#tBy').textContent = [by, long].filter(Boolean).join(' · ');
  $('#tGenres').textContent = (t.genres || []).join(' · ');
  $('#tAbout').textContent = t.overview || '';
  if (t.spine){ const im = new Image(); im.src = WORKER + t.spine; im.alt = `The spine of ${label}`; $('#tSpine').prepend(im); $('#tSpine').hidden = false; }
}
// the cover: worn when you've logged it (by how long ago your log was), otherwise clean
function paintCover(){
  const t = T.info, label = `${t.title}${t.year ? ` (${t.year})` : ''}`, src = viaWorker(T.item.cover);
  if (T.mine && window.Wear){ $('#tCover').replaceChildren(Wear.cover({src, kind: t.kind, seed: T.mine.id, at: T.mine.created_at, label: `The cover of ${label}, worn: you ${verb(t.kind)} it`, width: 160})); return; }
  $('#tCover').innerHTML = src ? `<img class="clean" src="${esc(src)}" alt="The cover of ${esc(label)}">` : '<span class="blank" aria-hidden="true"></span>';
}

/* ---------- what people here did with it ---------- */
// PostgREST's ilike, with % and _ taken as themselves: the same title, whatever its capitals
const likeOf = s => String(s).replace(/[\\%_]/g, c => '\\' + c);
const titleQuery = () => `kind=eq.${T.match.kind}&title=ilike.${encodeURIComponent(likeOf(T.match.title))}&year=${T.match.year ? 'eq.' + T.match.year : 'is.null'}`;
async function community(){
  const asks = [
    Posts.rest(`logs?select=id,owner,kind,title,author,year,cover_src,caption,created_at,profiles(username,display_name,avatar_key)&${titleQuery()}&order=created_at.desc&limit=200`).catch(() => []),
    Posts.rest(`shelf_items?select=shelf_id,shelves(id,owner,name,caption,profiles(username,display_name,avatar_key))&${titleQuery()}&limit=300`).catch(() => []),
    me.user ? Posts.rest(`follows?select=followee&follower=eq.${me.user.id}&limit=1000`).catch(() => []) : [],
  ];
  const [logs, items, follows] = await Promise.all(asks);
  T.friends = new Set((follows || []).map(f => f.followee));
  let rows = (logs || []).filter(l => l.profiles).map(l => ({...l, what: 'log', at: l.created_at, username: l.profiles.username, display_name: l.profiles.display_name, avatar_key: l.profiles.avatar_key}));
  T.social = await Posts.ready();
  if (T.social && rows.length){ let st = new Map(); try { st = await Posts.stats(rows.map(x => x.id)); } catch {} rows = rows.map(x => st.has(x.id) ? {...x, ...st.get(x.id)} : x); }
  T.logs = rows;
  T.mine = me.user ? rows.find(x => x.owner === me.user.id) || null : null;
  // each shelf once, then each person once (their newest shelf with it)
  const seen = new Set();
  T.shelves = (items || []).map(r => r.shelves).filter(s => s && s.profiles && !seen.has(s.owner) && seen.add(s.owner));
  if (!T.item.cover){ const c = rows.map(x => String(x.cover_src || '').replace(/^url:/, '')).find(u => COVER_OK.test(u)); if (c) T.item.cover = c; }
}
function paintStats(){
  const k = T.info.kind, rated = T.logs.filter(x => x.rating >= 1 && x.rating <= 10), people = new Set(T.logs.map(x => x.owner));
  const friends = [...people].filter(id => T.friends.has(id)).length;
  $('#tStats').hidden = !people.size;
  if (!people.size) return;
  if (rated.length){
    const avg = rated.reduce((a, x) => a + x.rating, 0) / rated.length;
    $('#tAvg').innerHTML = `${Posts.stars(Math.round(avg))}<span class="grey">${(avg / 2).toFixed(1)} of 5 · ${rated.length} rating${rated.length === 1 ? '' : 's'}</span>`;
    const n = Array.from({length: 10}, (_, i) => rated.filter(x => x.rating === i + 1).length), most = Math.max(...n);
    $('#tHist').innerHTML = n.map((c, i) => `<li data-n="${c}" style="height:${c ? Math.max(8, Math.round(100 * c / most)) : 2}%" title="${(i + 1) / 2} of 5: ${c}"></li>`).join('');
    $('#tHist').setAttribute('aria-label', `Ratings, from half a spine to five: ${n.join(', ')}`);
  }
  $('#tAvg').hidden = $('#tHist').hidden = !rated.length;
  $('#tWho').textContent = `${verb(k)} by ${people.size}${me.user ? ` · ${friends} friend${friends === 1 ? '' : 's'}` : ''}`;
}
function paintShelves(){
  const mine = me.user && T.shelves.some(s => s.owner === me.user.id), list = T.shelves.filter(s => !me.user || s.owner !== me.user.id)
    .sort((a, b) => (T.friends.has(b.owner) ? 1 : 0) - (T.friends.has(a.owner) ? 1 : 0));
  T.onMine = mine;
  $('#onSec').hidden = !list.length;
  $('#onH').textContent = `On shelves (${list.length})`;
  $('#onList').replaceChildren(...list.slice(0, 12).map(s => {
    const li = document.createElement('li'), p = s.profiles, name = Shelf.shelfName({name: s.name, caption: s.caption});
    li.innerHTML = `<a href="../u/?${esc(p.username)}&amp;shelf=${esc(s.id)}" aria-label="@${esc(p.username)}: ${esc(name)}" title="@${esc(p.username)}: ${esc(name)}">${Posts.avaHtml(p)}</a>`;
    return li;
  }));
  $('#onMore').hidden = list.length <= 12;
  $('#onMore').textContent = `and ${list.length - 12} more`;
}

/* ---------- the panel ---------- */
let watchKeys = new Set();
const keyOf = m => [m.kind === 'movie' ? 'movie' : 'book', String(m.title || '').trim().toLowerCase(), String(m.year || '')].join('|');
async function paintPanel(){
  const m = T.item, k = T.info.kind, recs = !!me.profile && !!(await Nav.loadRecs()), onNext = watchKeys.has(keyOf(m));
  const state = (html, cls = '') => `<span class="state ${cls}">${CHECK}${html}</span>`;
  $('#tPanel').innerHTML = [
    T.mine ? state(`<a href="../p/?${esc(T.mine.id)}">Logged ${esc(dated(T.mine.created_at))}</a>`) : `<button class="btn primary" type="button" data-t="log">Log</button>`,
    T.onMine ? state('On your shelf') : `<button class="dash" type="button" data-t="shelf">Put on shelf</button>`,
    onNext ? state('In Up next') : T.mine ? '' : `<button class="dash" type="button" data-t="watch">Add to Up next</button>`,
    recs ? `<button class="dash" type="button" data-t="rec">Recommend</button>` : '',
    `<span class="pmenuwrap"><button class="dash" type="button" data-t="share">Share</button></span>`,
  ].join('');
  const url = () => new URL(addressOf(), location.href).href;
  Posts.menuOn($('#tPanel [data-t=share]'), async () => {
    const label = `${T.info.title}${T.info.year ? ` (${T.info.year})` : ''}`;
    const list = [{label: 'Copy link', run: async () => { try { await navigator.clipboard.writeText(url()); toast('Link copied.'); } catch { toast(url()); } }},
      {label: 'Share to WhatsApp', run: () => { window.open(Nav.whatsapp(`${label} on shelfstackd:`, url()), '_blank', 'noopener'); }}];
    if (navigator.share) list.push({label: 'Share…', run: async () => { try { await navigator.share({url: url(), title: label}); } catch {} }});
    return list;
  });
}
$('#tPanel').addEventListener('click', async e => {
  const b = e.target.closest('[data-t]'); if (!b || b.dataset.t === 'share') return;
  const m = T.item, what = b.dataset.t;
  if (what === 'rec'){ Nav.recommend(m); return; }
  if (Nav.visitor()){ Nav.needAccount(what === 'watch' ? 'watch' : 'add', m); return; }
  if (what === 'log'){ Nav.add({mode: 'log', item: m}); return; }
  if (what === 'shelf'){ Nav.add({mode: 'shelf', item: m}); return; }
  if (what === 'watch'){
    b.disabled = true;
    const ok = await Nav.loadAdd(), r = ok ? await Add.watch(m) : {error: 'That didn’t work. Try again in a moment.'};
    if (r.ok){ watchKeys.add(keyOf(m)); paintPanel(); } else { b.disabled = false; toast(r.error); }
  }
});
// logged here (+ ADD, or Your review): the page again, with it
document.addEventListener('shelfstackd:added', async e => {
  const d = e.detail || {};
  if (d.what === 'watch' && d.item) watchKeys.add(keyOf(d.item));
  if (d.what === 'log'){ await community(); paintAll(); return; }
  paintPanel();
});

/* ---------- reviews ---------- */
// a review: a log with a rating or something said. Friends: the people you follow; Popular: the most liked first;
// Recent: the newest first. 20 a tab
const said = x => !!(x.rating || (x.review != null && x.review !== '' ? x.review : x.caption));
function paintReviews(tab){
  const all = T.logs.filter(said), friendsOnes = all.filter(x => T.friends.has(x.owner));
  $('#tabF').hidden = !me.user;
  tab = tab || (me.user && friendsOnes.length ? 'friends' : 'popular');
  T.tab = tab;
  for (const b of document.querySelectorAll('#revSec .tabs button')) b.setAttribute('aria-selected', String(b.dataset.rev === tab));
  const list = tab === 'friends' ? friendsOnes : tab === 'popular' ? all.slice().sort((a, b) => (b.likes || 0) - (a.likes || 0) || (b.at > a.at ? 1 : -1)) : all;
  $('#revList').replaceChildren(...list.slice(0, 20).map(x => Posts.item(x, {social: T.social, cover: 72, onGone: async () => { await community(); paintAll(); }})));
  $('#revNone').textContent = tab === 'friends' ? 'Nobody you follow has reviewed it yet.' : `Nobody has reviewed it yet.`;
  $('#revNone').hidden = !!list.length;
}
document.querySelector('#revSec .tabs').addEventListener('click', e => { const b = e.target.closest('[data-rev]'); if (b) paintReviews(b.dataset.rev); });
document.querySelector('#revSec .tabs').addEventListener('keydown', e => {
  const all = [...e.currentTarget.querySelectorAll('button:not([hidden])')], i = all.indexOf(document.activeElement); if (i < 0 || (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft')) return;
  const next = all[(i + (e.key === 'ArrowRight' ? 1 : all.length - 1)) % all.length]; next.focus(); next.click();
});

// Your review: signed in and not logged yet. One press on the spines rates it; then the review and Post show
let yf = null;
async function paintYours(){
  const show = !!me.profile && !T.mine && T.social;
  $('#yours').hidden = !show;
  if (!show || yf) return;
  yf = await Posts.fields($('#yFields'), T.item);
  const slider = $('#yFields .rating[role=slider]');
  if (slider) new MutationObserver(() => { if (+slider.getAttribute('aria-valuenow') > 0) $('#yours').classList.add('rated'); }).observe(slider, {attributes: true, attributeFilter: ['aria-valuenow']});
}
$('#yPost').addEventListener('click', async () => {
  if (!yf) return;
  const b = $('#yPost'); b.disabled = true; $('#ySay').textContent = 'Posting…';
  const r = await Posts.save(T.item, yf.values());
  b.disabled = false;
  if (r.error){ $('#ySay').textContent = r.error; return; }
  $('#ySay').textContent = ''; toast(`Logged ${T.item.title}. It’s on the feed.`);
});

function paintAll(){ paintCover(); paintStats(); paintShelves(); paintPanel(); paintReviews(T.tab); paintYours(); }

/* At once, before anything is asked: what the link says (its title and year), and the Worker asked. Then, signed in
   or not, what people did with it (your log, the cover from it); the Worker's details come in when it answers. */
let asking = null;
function first(){
  if (!ASK){ $('#state').textContent = 'Which film or book? This link doesn’t say.'; return; }
  asking = info();
  if (!ASK.title) return;   // an id alone: the Worker has to say what it is
  T.info = fromLink(); T.match = {kind: ASK.kind, title: ASK.title, year: ASK.year};
  T.item = {kind: ASK.kind, title: ASK.title, year: ASK.year, creator: '', cover: '', ...(ASK.film ? {tmdb: ASK.film} : ASK.book ? {ol: ASK.book} : {})};
  paintInfo(); paintCover();
  $('#state').hidden = true; $('#page').hidden = false;
}
// the Worker's details on top of the link's: the title as TMDB or Open Library writes it, who made it, how long, the rest
function details(t){
  T.info = {...t, title: t.title || T.info.title};
  if (!T.match) T.match = {kind: t.kind, title: t.title, year: t.year || ''};
  T.item = {...T.item, kind: t.kind, title: T.item && T.item.title || t.title, year: T.item && T.item.year || t.year || '', creator: t.creator || '',
    cover: T.item && T.item.cover || (COVER_OK.test(t.cover || '') ? t.cover : ''), ...(t.kind === 'movie' ? {tmdb: t.id} : {ol: t.id})};
  history.replaceState(null, '', addressOf() + location.hash);   // the id's address, still with the title and year to match by
  paintInfo();
}
async function load(){
  if (!ASK) return;
  if (!T.info){
    const t = await asking;
    if (!t){ $('#state').textContent = 'This title couldn’t load. Try again in a moment.'; return; }
    T.item = {}; details(t);
    $('#state').hidden = true; $('#page').hidden = false;
  } else asking.then(t => { if (t){ details(t); if (T.logs) paintCover(); } });
  await community();
  watchKeys = await Posts.watched().catch(() => new Set());
  paintAll();
}

first();
(async () => {
  await startSession();
  Nav.paint(me);
  await load();
})();
})();
</script>
