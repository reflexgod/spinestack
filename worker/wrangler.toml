name = "spinestack"
main = "src/index.js"
compatibility_date = "2026-09-01"
# The Worker's address on the site's domain: Cloudflare makes the DNS record and the certificate when this deploys.
# Keep workers_dev = true: the pages fall back to the workers.dev address on networks that block api.shelfstackd.com
# (some college and office Wi-Fi block new domains; see worker-address.js).
routes = [{ pattern = "api.shelfstackd.com", custom_domain = true }]
workers_dev = true

# Secrets (set with `npx wrangler secret put <NAME>`, never written here):
#   TMDB_TOKEN     TMDB v4 "API Read Access Token" (or v3 key)
#   SERPER_KEY     serper.dev API key (Google Images; the first place /scans looks)
#   SERPAPI_KEY    serpapi.com API key (Google Images; the second)
#   BRAVE_API_KEY  Brave Search API subscription token (the third)
#   ADMIN_TOKEN    for admin.html (approve or delete archive uploads)
# No Supabase secret key: the Worker checks sign-ins with the public (publishable) key below.

# Supabase (accounts). Both are public: the same two values are in index.html.
[vars]
SUPABASE_URL = "https://fiukspnovrlzlcdekcnb.supabase.co"
SUPABASE_KEY = "sb_publishable_cZeUDJXk-nCbSJ4VZWn_GQ_6xNFyBo2"
# /scans looks for a title's scans with Serper, then SerpApi, then Brave, then archive.org, stopping at the first that
# gives a usable one. These are the most searches each makes in a day, across everyone. Once a provider reaches its
# number it's passed over until tomorrow (UTC). Change a number here and deploy; 0 turns that provider off.
# Serper: 2,500 free credits, once. A search here costs 2, so SERPER_TOTAL_CAP (credits in all, ever) stops just short
# of them; raise it if you buy more.
SERPER_DAILY_CAP = "100"
SERPER_TOTAL_CAP = "2400"
# SerpApi: 250 free searches a month. 8 a day is at most 248.
SERPAPI_DAILY_CAP = "8"
# Brave bills after about 1,000 a month: 30 a day is at most 930.
BRAVE_DAILY_CAP = "30"
# archive.org needs no key and asks nothing for it; this is only manners.
ARCHIVE_ORG_DAILY_CAP = "100"

# One tiny Supabase read a day, so the free project isn't paused for inactivity.
[triggers]
crons = ["0 3 * * *"]

# Images saved shelves need are in SPINE_CACHE (KV, keys ub:...) for now. To move them to R2 later: create a
# bucket, then uncomment this; the Worker uses R2 whenever USER_R2 is bound.
# [[r2_buckets]]
# binding = "USER_R2"
# bucket_name = "spinestack-user"

# Profile photos, walls and wall PNGs (/m/...). Create the bucket once with:
#   npx wrangler r2 bucket create shelfstackd-media
# (Separate from USER_R2 above: keep that one commented out, or the shelf images already saved in KV stop showing.)
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "shelfstackd-media"

# Photos, walls and PNGs: 20 uploads a minute per account.
[[ratelimits]]
name = "UPLOAD_LIMITER"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 20
  period = 60

# Caches /identify and /scans results for 30 days.
# Create with `npx wrangler kv namespace create SPINE_CACHE` and paste the id below.
[[kv_namespaces]]
binding = "SPINE_CACHE"
id = "5025e1e9a6f94d8bb1d91f90de9f9954"

# Searches (identify + scans + found) a minute per address. 120, not 30: a campus or a phone network puts many
# people behind one address, and a person adding titles makes about 10 a minute (docs/LOAD.md).
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 120
  period = 60

# Images a minute per address: one search loads up to ~12, so this one is looser (300, for shared addresses too).
[[ratelimits]]
name = "IMG_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 300
  period = 60

# The archive's moderation state (status, reports, lists, daily upload counts). SQLite-backed,
# which the Workers Free plan allows. The spine PNGs themselves are in SPINE_CACHE (KV).
[[durable_objects.bindings]]
name = "ARCHIVE"
class_name = "Archive"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Archive"]
