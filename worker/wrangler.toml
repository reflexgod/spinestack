name = "spinestack"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Secrets (set with `npx wrangler secret put <NAME>`, never written here):
#   TMDB_TOKEN     TMDB v4 "API Read Access Token" (or v3 key)
#   BRAVE_API_KEY  Brave Search API subscription token
#   ADMIN_TOKEN    for admin.html (approve or delete archive uploads)
# No Supabase secret key: the Worker checks sign-ins with the public (publishable) key below.

# Supabase (accounts). Both are public: the same two values are in index.html.
[vars]
SUPABASE_URL = "https://fiukspnovrlzlcdekcnb.supabase.co"
SUPABASE_KEY = "sb_publishable_cZeUDJXk-nCbSJ4VZWn_GQ_6xNFyBo2"

# One tiny Supabase read a day, so the free project isn't paused for inactivity.
[triggers]
crons = ["0 3 * * *"]

# Images saved shelves need are in SPINE_CACHE (KV, keys ub:...) for now. To move them to R2 later: create a
# bucket, then uncomment this; the Worker uses R2 whenever USER_R2 is bound.
# [[r2_buckets]]
# binding = "USER_R2"
# bucket_name = "spinestack-user"

# Profile photos, walls and wall PNGs (/m/...). Create the bucket once with:
#   npx wrangler r2 bucket create shelfstackd-media
# (Separate from USER_R2 above: keep that one commented out, or the shelf images already saved in KV stop showing.)
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "shelfstackd-media"

# Photos, walls and PNGs: 20 uploads a minute per account.
[[ratelimits]]
name = "UPLOAD_LIMITER"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 20
  period = 60

# Caches /identify and /scans results for 30 days.
# Create with `npx wrangler kv namespace create SPINE_CACHE` and paste the id below.
[[kv_namespaces]]
binding = "SPINE_CACHE"
id = "5025e1e9a6f94d8bb1d91f90de9f9954"

# About 30 searches a minute per visitor (identify + scans).
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 60

# Images: one search loads up to ~12, so this one is looser.
[[ratelimits]]
name = "IMG_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 150
  period = 60

# The archive's moderation state (status, reports, lists, daily upload counts). SQLite-backed,
# which the Workers Free plan allows. The spine PNGs themselves are in SPINE_CACHE (KV).
[[durable_objects.bindings]]
name = "ARCHIVE"
class_name = "Archive"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Archive"]
